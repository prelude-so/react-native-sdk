apply plugin: 'com.android.library'

group = 'so.prelude.reactnative.sdk'
version = '1.0.0-beta.1'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    defaultConfig {
      // The native Prelude Android SDK requires API 26+.
      minSdkVersion safeExtGet("minSdkVersion", 26)
      targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }
  }
}

android {
  namespace "so.prelude.reactnative.sdk"
  defaultConfig {
    versionCode 1
    versionName version
  }
  lintOptions {
    abortOnError false
  }
}

// The Android SDK is served through the app's distribution link, which the app
// registers as a Maven repository in its android/build.gradle (the Expo config
// plugin writes it). Checked here so a missing link fails with a clear message.
def preludeLinkRepository = rootProject.allprojects.any { p ->
  p.repositories.any { it instanceof MavenArtifactRepository && it.url.toString() ==~ /.*\/dis_[0-9a-z]{26}\/maven\/?/ }
}
if (!preludeLinkRepository) {
  throw new GradleException('Prelude: add the Maven repository link of your app, from the Prelude Dashboard, to allprojects.repositories in android/build.gradle.')
}
def preludeSdkVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).so_prelude.android_sdk_version

dependencies {
  compileOnly('com.squareup.okhttp3:okhttp:4.12.0')
  implementation("so.prelude.android:sdk:${preludeSdkVersion}")
}
